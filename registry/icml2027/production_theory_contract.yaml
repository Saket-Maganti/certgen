schema_version: certgen.icml2027.production_theory_contract.v1
method_id: paired_rbf_linear_time_union_hoeffding
random_variables: prospectively ordered disjoint A/B/reference row pairs after a frozen seeded permutation
filtration: sigma-field generated by completed disjoint contribution units in frozen order
target_estimand: MMD_squared(A,R)-MMD_squared(B,R) for fixed populations, extractor, preprocessing, normalization, and gamma
paired_contribution_definition: k(A1,A2)-k(B1,B2)-k(A1,R2)-k(A2,R1)+k(B1,R2)+k(B2,R1)
support_bound: [-3.0, 3.0]
conditional_mean_assumption: each contribution has the fixed target conditional mean given prior stream units
reference_sampling_assumption: IID with replacement from a fixed empirical population under a precommitted draw plan
candidate_sampling_assumption: mutually independent candidate samples generated from fixed candidate populations
independence_dependence_assumptions:
- disjoint stream units
- no adaptive cache, preprocessing, gamma, reference draw, or prefix selection
- shared reference pair inside one A-vs-B contribution is intentional and algebraically declared
stopping_time_guarantee: confidence sequence is simultaneous over all positive integer looks through countable alpha allocation
multiplicity_allocation: Bonferroni across the two confirmatory feature-space hypotheses in CIFAR 10k v2
validity_statement: conservative union-Hoeffding coverage under the declared bounded conditional-mean stream contract
theorem_to_code:
  support_bound: certgen.metrics.kernels.certified_kernel_bounds
  contribution: certgen.metrics.streams.paired_mmd_difference_contributions
  boundary: certgen.stats.bounds.hoeffding_union_radius
  certificate: certgen.stats.cs.hoeffding_cs
  reference_design: certgen.stats.reference_sampling.validate_reference_sampling_contract
unproven_extensions:
  finite_population_without_replacement: NOT_PROVEN
  empirical_bernstein_anytime_boundary: NOT_PROVEN
  betting_grid_continuum_inversion: NOT_PROVEN
  adaptive_graph_frontier: NOT_PROVEN
claim_allowed: false
