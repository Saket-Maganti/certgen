study_id: certgen_cvpr_cifar_integrity_minimal
version: 1
primary_question: Which prospectively selected comparisons are directionally decided
  by bounded RBF-MMD evidence?
primary_outcomes:
- family-wise-valid pairwise decisions
- certified partial ranking
secondary_outcomes:
- cross-feature agreement
- ranking stability
- samples to first decision
benchmarks:
- cifar10
models:
- google_ddpm_cifar10_candidate
- frank_ddpm_ema_cifar10_candidate
model_pairs:
- comparison_id: checkpoint_variant
  model_a: google_ddpm_cifar10_candidate
  model_b: frank_ddpm_ema_cifar10_candidate
  comparison_type: same family different checkpoint
controls:
- null_reference_split
- obvious_gap_corruption
controls_in_confirmatory_family: false
controls_claim_allowed: false
feature_spaces:
- inception
- clip
metrics:
- rbf_mmd
kernel:
  name: rbf
  normalize: l2
  gamma: 0.5
bandwidth_protocol: prospectively_fixed_unit_sphere_gamma_0.5_v1
alpha: 0.05
multiplicity_families:
- cvpr_primary_cifar10
sample_budgets:
- 1000
stopping_rule: first_boundary_crossing_union_hoeffding
stream_seed: 0
reference_draw_protocol: iid_with_replacement_from_fixed_empirical_population_precommitted
reference_count: 1000
generation_count: 1000
sanity_thresholds:
  null_max_absolute: 0.05
  obvious_gap_minimum: 1.0e-08
  repeated_batching_max_feature_difference: 1.0e-05
  repeated_batching_max_metric_difference: 1.0e-07
  repeated_shard_merge_max_feature_difference: 0.0
  repeated_shard_merge_max_metric_difference: 0.0
  corruption_ladder_minimum_aggregate_step: 1.0e-08
