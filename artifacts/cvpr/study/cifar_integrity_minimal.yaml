exclusion_rules:
- invalid provenance or license approval
- asset or preprocessing mismatch
- nonfinite or incomplete features
- failed metric reproduction or sanity gate
failure_rules:
- fail closed; never substitute models, extractors, or pairs after outcomes are inspected
resume_rules:
- same study, configuration, asset, image-manifest, stream-order, draw, and alpha
  hashes only
missing_data_rules:
- block the affected comparison; do not impute
censoring_rules:
- UNDECIDED_AT_BUDGET is right-censored at the registered maximum budget
claim_thresholds:
- lineage, sanity, family, certificate, and paper gates must separately pass
scale_up_rules:
- stop_and_interpret_after_1k
- create_a_new_study_version_before_10k_or_50k
pivot_rules:
- a scientific pivot requires a new prospective study version
